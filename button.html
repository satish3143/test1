<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Example</title>
</head>
<body>
  <h1>Welcome!</h1>
  <h2>World!</h2>
  <button onclick="sayHello()">Click Me</button>

  <script>
    function sayHello() {
      alert('Hello from HTML!');
    }
  </script>
</body>
</html>
